name: hermes-lang-ca
version: 0.2.1
description: "Catalan (Català) language pack for Hermes Agent. Covers all text-overridable core, TUI and Desktop catalog keys; preserves command syntax and non-text Desktop values. Text-only catalogs, no Python plugin code or network access."
requires_hermes: ">=0.21.6"
provides_locales:
  - id: ca
    endonym: Català
    rtl: false
