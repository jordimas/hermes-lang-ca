explainer.exit.error_near_max_iterations: "s'ha produït un error prop del límit d'iteracions abans d'una resposta final. Reviseu la sortida de l'eina de dalt i després envieu `continue`."
explainer.exit.fallback_prior_turn_content: "aquesta volta no s'ha produït cap contingut nou; es mostra el context anterior recuperat. Envieu `continue` per tornar-ho a provar."
explainer.exit.interrupted_during_api_call: "la sol·licitud s'ha interromput a mig camí abans que es rebés cap resposta. Envieu `continue` per tornar-ho a provar."
explainer.exit.max_iterations_reached: "s'ha arribat al límit màxim d'iteracions d'eina abans d'una resposta final. Envieu `continue` per continuar, o augmenteu `max_iterations`."
explainer.exit.ollama_runtime_context_too_small: "la finestra de context del model local era massa petita per acabar. Augmenta la mida del context o usa un model més gran."
explainer.exit.partial_stream_recovery: "la transmissió s'ha aturat aviat i només s'ha pogut recuperar una resposta parcial. Envieu `continue` per reprendre-ho des d'on s'ha aturat."
explainer.exit.pending_tool_result: "la torn s'ha aturat mentre encara hi havia un resultat d'eina pendent i el model no ha produït cap text de seguiment. Envieu `continue` perquè en faci un resum."
explainer.exit.rebuilt_restart_limit_exceeded: "tots els proveïdors de la cadena de reserva han continuat fallant, de manera que la volta s'ha aturat en lloc de tornar-ho a provar indefinidament. Envieu `continue` o canvieu de proveïdor."
explainer.exit.redirect_restart_limit_exceeded: "la sol·licitud s'ha cancel·lat per una correcció nova a cada intent, de manera que la volta s'ha aturat en lloc de tornar-ho a provar indefinidament. la vostra última correcció està en cua com a missatge següent."
explainer.exit.repeated_outer_errors: "el torn ha continuat fallant amb errors repetits i s'ha aturat aviat en lloc de tornar-ho a provar indefinidament. Reviseu els errors de dalt i després envieu `continue` per tornar-ho a provar."
