gateway.topic.help: "/topic — activeu el mode DM multi-sessió (un bot, molts xats en paral·lel)\n\nÚs:\n  /topic             Activeu el mode de temes, o mostra'n l'estat si ja està actiu\n  /topic help        Mostra aquest missatge\n  /topic off         Desactiveu el mode de temes i neteja les vinculacions de temes\n  /topic <id>        Dins d'un tema: restaura-hi una sessió anterior per ID\n\nCom funciona:\n1. Executeu /topic una vegada en aquest DM — Hermes comproveu que la configuració de Threads de BotFather\n   estigui activada i activeu el mode multi-sessió.\n2. Obriu Tots els missatges a la part superior del bot i envia-hi qualsevol missatge.\n   Telegram crea un tema nou per a aquest missatge; cada tema és\n   una sessió independent de Hermes (historial nou, context nou).\n3. El DM arrel es converteix en un vestíbul del sistema — envia-hi /topic, /status,\n   /help, /usage. Les instruccions normals van dins d'un tema.\n4. /new dins d'un tema només reinicieu la sessió d'aquest tema.\n5. /topic <id> dins d'un tema restaura-hi una sessió antiga."
gateway.topic.mode_disabled: "El mode de tema multi-sessió ara està DESACTIVAT per a aquest xat.\n\nEls temes existents a Telegram no s'eliminen — simplement deixaran de ser gestionats com a sessions independents. El DM arrel torneu a funcionar com un xat normal de Hermes. Executeu /topic per tornar-lo a activar més endavant."
gateway.topic.mode_not_enabled: "El mode de tema multi-sessió no està activat actualment per a aquest xat."
gateway.topic.new_header: "S'ha iniciat una sessió nova de Hermes en aquest tema.\n\nConsell: per treball en paral·lel, obriu Tots els missatges i envia-hi un missatge per crear un tema separat en lloc de fer servir /new aquí. /new substitueix la sessió associada al tema actual."
