explainer.file_mutation.header: "⚠️ Verificador de mutació de fitxers: {count} edició(ns) de fitxer HAN FALLAT aquest torn malgrat qualsevol redacció anterior que pugui suggerir el contrari. Executeu `git status` o `read_file` per confirmar què ha arribat realment."
explainer.no_reply_prefix: "⚠️ Sense resposta: "
explainer.persistence.compression: "el torn s'ha aturat perquè un altre procés estava comprimint aquesta sessió. el vostre missatge ja hauria d'estar desat; torneu-lo a enviar després que la compressió s'acabi."
explainer.persistence.compression_closed: "el torn s'ha aturat perquè aquesta sessió s'ha reubicat per la compressió de context i la continuació en directe no s'ha pogut adoptar. L'emmagatzematge està bé; refresca el client (o inicia un torn nou) perquè recuperi el nou id de sessió, i després torneu a enviar el vostre missatge."
explainer.persistence.corrupt: "el torn s'ha aturat perquè la base de dades d'estat ha informat d'una corrupció estructural (la transcripció s'hauria perdut en reiniciar). Alliberar espai en disc no ajudarà. Opcions de recuperació:\n1. Executeu `hermes {profile_arg}doctor --fix`\n2. Atura la passarel·la i després recupera amb:\n   hermes {profile_arg}sessions recover --source {db_path} --inspect-only\n   (si informa que és recuperable) hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — la recuperació crea una instantània del fitxer malmès abans; NO executis `sqlite3 ... \".recover\"` contra el state.db en viu, un client sqlite3 vulnerable podria corrompre'l encara més\n3. Restaura des d'una còpia de seguretat a {backups_dir}/\nDesprés torneu a enviar el vostre missatge."
explainer.persistence.default: "Hermes no ha pogut desar aquesta conversa, així que s'ha aturat en lloc de perdre els vostres missatges. Causes possibles: la unitat no té espai, o un altre procés de Hermes està retenint la base de dades. Tanqueu les altres finestres de Hermes, executeu `hermes {profile_arg}doctor` per comprovar l'emmagatzematge i després torneu a enviar el vostre missatge."
explainer.persistence.deleted_wal: "un altre procés de Hermes encara conserva una còpia antiga del registre d'escriptura anticipada de la base de dades de la sessió, de manera que Hermes ha deixat d'escriure per mantenir el fitxer segur i aquest missatge no s'ha desat (se'n conserva una còpia a {home}/sessions/). No s'ha perdut res. Tanqueu tots els processos de Hermes d'aquest perfil (aplicació d'escriptori, `hermes {profile_arg}gateway stop`, tauler, cron), executeu `hermes {profile_arg}doctor` — indica qualsevol procés que encara estigui retenint el registre — i després torneu a iniciar Hermes i envieu el vostre missatge una altra vegada. No executis `doctor --fix` ni suprimeixis cap fitxer state.db mentre s'estiguin executant. Guia: {recovery_docs}"
explainer.persistence.disk: "Hermes no ha pogut desar aquesta conversa al disc, així que s'ha aturat en lloc de perdre els vostres missatges. Probablement el disc és ple: allibera espai (o corregeix els permisos de {home}/state.db), i després torneu a enviar el vostre missatge."
explainer.persistence.fts_index: "el torn s'ha aturat perquè l'índex de cerca de la sessió (FTS5) està corrupte i no s'ha pogut separar, de manera que aquest missatge no s'ha desat. L'emmagatzematge dels missatges no està danyat: no executis eines de recuperació ni restauris una còpia de seguretat. Executeu `hermes {profile_arg}doctor --fix` (o reinicieu Hermes, que repara l'índex en obrir-se), i després torneu a enviar el vostre missatge."
explainer.persistence.locked: "el torn s'ha aturat perquè l'emmagatzematge de la sessió estava ocupat (un altre procés de Hermes estava escrivint a la base de dades d'estat). el vostre missatge ja hauria d'estar desat; torneu-lo a enviar d'aquí a un moment."
explainer.persistence.replaced: "el fitxer de la base de dades de la sessió s'ha substituït mentre Hermes s'executava, de manera que aquest missatge no s'ha desat (se'n conserva una còpia a {home}/sessions/). Atura Hermes (`hermes {profile_arg}gateway stop`), executeu `hermes {profile_arg}doctor` — no `hermes {profile_arg}doctor --fix`, que repararia el fitxer equivocat in situ — i després torneu-lo a iniciar i envieu el vostre missatge una altra vegada. Els passos avançats de recuperació són al registre."
explainer.persistence.session_row_missing: "aquesta sessió s'ha suprimit de l'emmagatzematge mentre el xat encara era obert, i Hermes no l'ha pogut recrear, de manera que aquest missatge no s'ha desat. Torneu a enviar el vostre missatge; si continua fallant, executeu `hermes {profile_arg}doctor`."
explainer.persistence.turn_lease: "el torn s'ha aturat perquè un altre procés de Hermes ha pres el control d'aquesta sessió. la vostra resposta no s'ha desat; espereu que l'altre procés acabi i després torneu a enviar el vostre missatge."
