tips.t001: "/bg <prompt> executa una tasca en una sessió separada mentre l'actual queda lliure; /btw <question> respon una pregunta addicional sobre aquesta conversa sense interrompre-la."
tips.t002: "/branch bifurca la sessió actual per explorar una altra direcció sense perdre el progrés."
tips.t003: "/compress comprimeix manualment el context quan la conversa s'allarga."
tips.t004: "/rollback llista els punts de control del sistema de fitxers per restaurar els fitxers que l'agent ha modificat a un estat anterior."
tips.t005: "/rollback diff 2 mostra els canvis des del punt de control 2 sense restaurar res."
tips.t006: "/rollback 2 src/file.py restaura un sol fitxer d'un punt de control concret."
tips.t007: "/title \"my project\" dona un nom a la sessió; reprèn-la més endavant amb /resume o hermes -c."
tips.t008: "/resume reprèn una sessió amb nom des d'on la vas deixar."
tips.t009: "/queue <prompt> posa un missatge a la cua per al torn següent sense interrompre l'actual."
tips.t010: "/undo elimineu l'últim intercanvi entre l'usuari i l'assistent de la conversa."
tips.t011: "/retry torneu a enviar l'últim missatge; és útil si la resposta de l'agent no era l'adequada."
tips.t012: "/verbose canvieu la visualització del progrés de les eines: off → new → all → verbose."
tips.t013: "/reasoning high augmenta la profunditat del raonament del model. /reasoning show mostra el raonament."
tips.t014: "/fast activeu o desactiveu el processament prioritari per obtenir respostes de l'API més ràpides (depèn del proveïdor)."
tips.t015: "/yolo omet totes les aprovacions d'ordres perilloses durant la resta de la sessió."
tips.t016: "/model permet canviar de model durant la sessió; proveu /model sonnet o /model gpt-5."
tips.t017: "/model --global canvieu permanentment el model predeterminat."
tips.t018: "/personality pirate estableix una personalitat divertida; hi ha 14 opcions integrades, de kawaii a shakespeare."
tips.t019: "/skin canvieu el tema de la CLI; proveu ares, mono, slate, poseidon o charizard."
tips.t020: "/statusbar mostra o amaga una barra persistent amb el model, els tokens, el percentatge d'ús del context, el cost i la durada."
tips.t021: "/tools disable browser elimineu temporalment les eines del navegador de la sessió actual."
tips.t022: "/browser connect connecta les eines del navegador al navegador Chromium o derivat que teniu obert mitjançant CDP."
tips.t023: "/plugins llista els complements instal·lats i el seu estat."
tips.t024: "/cron gestiona les tasques programades; configureu instruccions recurrents amb lliurament a qualsevol plataforma."
tips.t025: "/reload-mcp torneu a carregar la configuració dels servidors MCP sense reiniciar."
tips.t026: "/usage mostra l'ús de tokens, el detall del cost i la durada de la sessió."
tips.t027: "/insights mostra les estadístiques d'ús dels últims 30 dies."
tips.t028: "/paste cerca una imatge al porta-retalls i l'adjunta al missatge següent."
tips.t029: "/profile mostra el perfil actiu i el seu directori principal."
tips.t030: "/config mostra la configuració actual d'un cop d'ull."
tips.t031: "/stop atura tots els processos en segon pla que l'agent ha iniciat."
tips.t032: "@file:path/to/file.py incorpora el contingut del fitxer directament al missatge."
tips.t033: "@file:main.py:10-50 incorpora només les línies 10-50 d'un fitxer."
tips.t034: "@folder:src/ incorpora la llista de fitxers d'un directori en forma d'arbre."
tips.t035: "@diff incorpora al missatge els canvis de Git que no heu afegit a l'índex."
tips.t036: "@staged incorpora els canvis de Git que heu afegit a l'índex (git diff --staged)."
tips.t037: "@git:5 incorpora els últims 5 commits amb els pedaços complets."
tips.t038: "@url:https://example.com obté el contingut d'una pàgina web i l'incorpora al missatge."
tips.t039: "Escriure @ activeu la compleció de camins del sistema de fitxers per navegar fins a qualsevol fitxer interactivament."
tips.t040: "Combina diverses referències: \"Reviseu @file:main.py i @file:test.py per comprovar que són coherents.\""
tips.t041: "Alt+Enter insereix una línia nova. (El Windows Terminal intercepta Alt+Enter; utilitza Ctrl+Enter.)"
tips.t042: "Ctrl+C interromp l'agent. Premeu-lo dues vegades en menys de 2 segons per forçar la sortida."
tips.t043: "Ctrl+Z suspèn Hermes en segon pla; executeu fg a l'intèrpret d'ordres per reprendre'l."
tips.t044: "Tab accepta el text suggerit o completa les ordres que comencen amb una barra."
tips.t045: "Escriviu un missatge nou mentre l'agent treballa per interrompre'l i redirigir-lo."
tips.t046: "Alt+V enganxa una imatge del porta-retalls a la conversa."
tips.t047: "Si enganxes 5 línies o més, es desen automàticament en un fitxer i s'hi insereix una referència compacta."
tips.t048: "hermes -c reprèn la sessió de la CLI més recent. hermes -c \"project name\" la reprèn pel títol."
tips.t049: "hermes -w crea un worktree de Git aïllat — perfecte per a fluxos de treball d'agents en paral·lel."
tips.t050: "hermes -w -q \"Fix issue #42\" combina l'aïllament del worktree amb una consulteu única."
tips.t051: "hermes chat -t web,terminal activeu només conjunts d'eines específics per a una sessió enfocada."
tips.t052: "hermes chat -s github-pr-workflow carrega prèviament una habilitat a l'inici."
tips.t053: "hermes chat -q \"query\" executeu una única consulta no interactiva i surt."
tips.t054: "hermes chat --max-turns 1000 substitueix el límit predeterminat de 500 iteracions per volta."
tips.t055: "hermes chat --checkpoints activeu instantànies del sistema de fitxers abans de cada canvi destructiu de fitxer."
tips.t056: "hermes --yolo evita totes les sol·licituds d'aprovació d'ordres perilloses durant tota la sessió."
tips.t057: "hermes chat --source telegram etiqueta la sessió per filtrar-la a la llista de sessions de hermes."
tips.t058: "hermes -p work chat s'executa sota un perfil específic sense canviar el vostre valor predeterminat."
tips.t059: "hermes doctor --fix diagnostica i repara automàticament problemes de configuració i dependències."
tips.t060: "hermes dump mostra un resum compacte de la configuració — ideal per a informes d'errors."
tips.t061: "hermes config set KEY VALUE redirigeix automàticament els secrets a .env i la resta a config.yaml."
tips.t062: "hermes config edit obriu config.yaml al vostre editor predeterminat."
tips.t063: "hermes config check analitza si falten opcions de configuració o si són obsoletes."
tips.t064: "hermes sessions browse obriu un selector interactiu de sessions amb cerca."
tips.t065: "hermes sessions stats mostra el recompte de sessions per plataforma i la mida de la base de dades."
tips.t066: "hermes sessions prune --older-than 30 neteja les sessions antigues."
tips.t067: "hermes skills search react --source skills-sh cerca al directori públic skills.sh."
tips.t068: "hermes skills check analitza les habilitats instal·lades del hub per veure si hi ha actualitzacions aigües amunt."
tips.t069: "hermes skills tap add myorg/skills-repo afegiu una font d'habilitats de GitHub personalitzada."
tips.t070: "hermes skills snapshot export setup.json exporta la configuració de les vostres habilitats per a còpia de seguretat o compartició."
tips.t071: "hermes mcp add github --command npx afegiu servidors MCP des de la línia d'ordres."
tips.t072: "hermes mcp serve executa el mateix Hermes com a servidor MCP per a altres agents."
tips.t073: "hermes auth add us permet afegir diverses claus API per a la rotació de la piscina de credencials."
tips.t074: "hermes completion bash >> ~/.bashrc activeu l'autocompletat amb la tecla de tabulació per a totes les ordres i perfils."
tips.t075: "hermes logs -f segueix agent.log en temps real. --level WARNING --since 1h filtra la sortida."
tips.t076: "hermes backup crea una còpia de seguretat zip de tot el vostre directori d'inici de Hermes."
tips.t077: "hermes profile create coder crea un perfil aïllat que esdevé la seva pròpia ordre."
tips.t078: "hermes profile create work --clone copia la vostra configuració i claus actuals a un perfil nou."
tips.t079: "hermes update sincronitza automàticament les noves habilitats incloses a TOTS els perfils."
tips.t080: "hermes gateway install prepara Hermes com a servei del sistema (systemd/launchd)."
tips.t081: "hermes memory setup us permet configurar un proveïdor de memòria extern (Honcho, Mem0, etc.)."
tips.t082: "hermes webhook subscribe crea rutes de webhook guiades per esdeveniments amb validació HMAC."
tips.t083: "Estalvia diners: hermes tools desactiveu les eines no utilitzades, hermes skills config retalla les habilitats."
tips.t084: "/reasoning low o /reasoning minimal redueix la profunditat de raonament per sota del valor per defecte (mitjà) — respostes més ràpides i més barates."
tips.t085: "hermes models enruta les tasques de visió, compressió i auxiliars a models més barats — redueix el cost de tokens en segon pla en un 85%+ sense degradar el vostre model principal de xat."
tips.t086: "Definiu display.bell_on_complete: true a config.yaml per sentir una campana quan acabin les tasques llargues."
tips.t087: "Definiu display.streaming: true per veure com els tokens apareixen en temps real a mesura que el model genera."
tips.t088: "Definiu display.show_reasoning: true per veure la cadena de pensament del model."
tips.t089: "Definiu display.compact: true per reduir els espais en blanc a la sortida i obtenir informació més densa."
tips.t090: "Definiu display.busy_input_mode: queue per posar els missatges en cua en lloc d'interrompre l'agent, o steer per injectar-los a mitja execució mitjançant /steer."
tips.t091: "Definiu display.resume_display: minimal per ometre el resum complet de la conversa en reprendre la sessió."
tips.t092: "Definiu compression.threshold: 0.50 per controlar quan s'activeu l'autocompressió (per defecte: 50% del context)."
tips.t093: "Estableix agent.max_turns: 1000 perquè l'agent pugui fer més passos amb crides a eines per torn."
tips.t094: "Definiu file_read_max_chars: 200000 per augmentar el màxim de contingut per crida read_file."
tips.t095: "Definiu approvals.mode: smart per permetre que un LLM aprovi automàticament les ordres segures i denegui automàticament les perilloses."
tips.t096: "Definiu fallback_model a config.yaml per fer una commutació automàtica a un proveïdor de reserva."
tips.t097: "Definiu privacy.redact_pii: true per fer hash dels identificadors d'usuari i dels números de telèfon abans d'enviar-los al LLM."
tips.t098: "Definiu browser.record_sessions: true per enregistrar automàticament les sessions del navegador com a vídeos WebM."
tips.t099: "Definiu worktree: true a config.yaml per crear sempre un git worktree (igual que hermes -w)."
tips.t100: "Definiu security.website_blocklist.enabled: true per bloquejar dominis específics de les eines web."
tips.t101: "Definiu cron.wrap_response: false per lliurar la sortida bruta de l'agent sense la capçalera ni el peu de cron."
tips.t102: "HERMES_TIMEZONE substitueix la zona horària del servidor per qualsevol cadena de zona horària IANA."
tips.t103: "La substitució de variables d'entorn funciona a config.yaml: usa la sintaxi ${VAR_NAME}."
tips.t104: "Les ordres ràpides a config.yaml executen ordres de shell a l'instant sense consumir cap token."
tips.t105: "Les personalitats personalitzades es poden definir a config.yaml sota agent.personalities."
tips.t106: "provider_routing controla l'ordenació, la llista blanca i la llista negra de proveïdors d'OpenRouter."
tips.t107: "execute_code executa scripts de Python que criden eines de Hermes programàticament — els resultats es mantenen fora del context."
tips.t108: "delegate_task crea fins a 10 subagents concurrents per defecte (delegation.max_concurrent_children) amb contextos aïllats per al treball en paral·lel."
tips.t109: "web_extract funciona amb URL de PDF — passa qualsevol enllaç a un PDF i el converteix a markdown."
tips.t110: "search_files es basa en ripgrep i és més ràpid que grep — fes-lo servir en lloc de grep al terminal."
tips.t111: "patch usa 9 estratègies de coincidència difusa perquè les petites diferències d'espais en blanc no trenquin les edicions."
tips.t112: "patch admet el format V4A per a edicions massives de diversos fitxers en una sola trucada."
tips.t113: "read_file suggereix noms de fitxer similars quan no es troba un fitxer."
tips.t114: "read_file desduplica automàticament — tornar a llegir un fitxer sense canvis retorna un marcador de posició lleuger."
tips.t115: "browser_vision fa una captura de pantalla i l'analitza amb IA — funciona amb CAPTCHA i contingut visual."
tips.t116: "browser_console pot avaluar expressions de JavaScript en el context de la pàgina."
tips.t117: "image_generate crea imatges amb FLUX 2 Pro i escalat automàtic x2."
tips.t118: "text_to_speech converteix text en àudio — es reprodueix com a bombolles de veu a Telegram."
tips.t119: "send_message pot accedir a qualsevol plataforma de missatgeria connectada des d'una sessió."
tips.t120: "L'eina todo ajuda l'agent a seguir tasques complexes de diversos passos durant una sessió."
tips.t121: "session_search fa una cerca de text complet a totes les converses anteriors."
tips.t122: "L'agent desa automàticament preferències, correccions i fets de l'entorn a la memòria."
tips.t123: "/moa envieu una instrucció difícil a través del vostre conjunt de models de Mixture of Agents configurat."
tips.t124: "Les ordres de terminal admeten mode en segon pla amb notify_on_complete per a tasques llargues."
tips.t125: "Els processos en segon pla del terminal admeten watch_patterns per alertar sobre línies de sortida específiques."
tips.t126: "L'eina terminal admet 6 backends: local, Docker, SSH, Modal, Daytona i Singularity."
tips.t127: "Cada perfil obté la seva pròpia configuració, claus API, memòria, sessions, habilitats i feines cron."
tips.t128: "Els noms de perfil esdevenen ordres de shell — 'hermes profile create coder' crea l'ordre 'coder'."
tips.t129: "hermes profile export coder -o backup.tar.gz crea un arxiu de perfil portàtil."
tips.t130: "Si dos perfils comparteixen accidentalment un token de bot, la segona passarel·la es bloqueja amb un error clar."
tips.t131: "Les sessions generen automàticament títols descriptius després del primer intercanvi — no cal donar-los nom manualment."
tips.t132: "Els títols de sessió admeten llinatge: \"my project\" → \"my project #2\" → \"my project #3\"."
tips.t133: "En sortir, Hermes imprimeix una ordre per reprendre amb l'ID de sessió i les estadístiques."
tips.t134: "hermes sessions export backup.jsonl exporta totes les sessions per a còpia de seguretat o anàlisi."
tips.t135: "hermes -r SESSION_ID reprèn qualsevol sessió passada específica pel seu ID."
tips.t136: "La memòria és una instantània congelada — els canvis només apareixen al prompt del sistema en iniciar la sessió següent."
tips.t137: "Les entrades de memòria es revisen automàticament a la recerca de patrons d'injecció d'instruccions i d'exfiltració."
tips.t138: "L'agent té dos espais de memòria: notes personals (~2200 caràcters) i perfil d'usuari (~1375 caràcters)."
tips.t139: "Les correccions que dones a l'agent (\"no, fes-ho així\") sovint es desen automàticament a la memòria."
tips.t140: "Més de 80 habilitats incloses que cobreixen GitHub, creativitat, mlops, productivitat, recerca i més."
tips.t141: "Cada habilitat instal·lada es converteix automàticament en una ordre amb barra inclinada — escriviu / per veure-les totes."
tips.t142: "hermes skills install official/security/1password instal·la habilitats opcionals del repositori."
tips.t143: "Les habilitats poden restringir-se a plataformes específiques del sistema operatiu — algunes només es carreguen a macOS o Linux."
tips.t144: "skills.external_dirs a config.yaml us permet carregar habilitats des de directoris personalitzats."
tips.t145: "L'agent pot crear les seves pròpies habilitats com a memòria procedimental amb skill_manage."
tips.t146: "/plan escriviu un pla d'implementació en markdown a .hermes/plans/ sense executar res."
tips.t147: "Les tasques cron poden adjuntar habilitats: hermes cron add --skill blogwatcher \"Comproveu si hi ha publicacions noves\"."
tips.t148: "Els destinataris de lliurament de cron inclouen Telegram, Discord, Slack, email, SMS i 12+ plataformes més."
tips.t149: "Si una resposta de cron comença amb [SILENT], el lliurament se suprimiu — útil per a tasques només de monitoratge."
tips.t150: "Cron admet retards relatius (30m), intervals (every 2h), expressions cron i segells de temps ISO."
tips.t151: "Les tasques de Cron s'executen en sessions d'agent completament noves — les instruccions han de ser autosuficients."
tips.t152: "El mode de veu funciona sense cap clau d'API si faster-whisper està instal·lat (transcripció de veu local gratuïta)."
tips.t153: "Hi ha cinc proveïdors de TTS disponibles: Edge TTS (gratuït), ElevenLabs, OpenAI, NeuTTS (local gratuït), MiniMax."
tips.t154: "/voice on activeu el mode de veu al CLI. Ctrl+B alterna la gravació push-to-talk."
tips.t155: "El TTS en streaming reprodueix les frases a mesura que es generen — no cal esperar la resposta completa."
tips.t156: "Els missatges de veu a Telegram, Discord, WhatsApp i Slack es transcriuen automàticament."
tips.t157: "Hermes s'executa en 21 plataformes de missatgeria: Telegram, Discord, Slack, WhatsApp, Signal, Matrix, IRC, Microsoft Teams, correu electrònic i altres."
tips.t158: "hermes gateway install el configureu com a servei del sistema que arrenca en iniciar-se."
tips.t159: "DingTalk fa servir el mode Stream — no calen webhooks ni una URL pública."
tips.t160: "BlueBubbles porta iMessage a Hermes a través d'un servidor local a macOS."
tips.t161: "Les rutes de webhook admeten validació HMAC, limitació de velocitat i filtratge d'esdeveniments."
tips.t162: "El servidor d'API exposa un punt d'accés compatible amb OpenAI, Open WebUI i LibreChat."
tips.t163: "Mode de canal de veu de Discord: el bot s'uneix al VC, transcriu la parla i respon parlant."
tips.t164: "group_sessions_per_user: true dona a cada persona la seva pròpia sessió als xats de grup."
tips.t165: "/sethome marca un xat com el canal d'inici per a les entregues de tasques cron."
tips.t166: "La passarel·la admet temps d'espera basats en la inactivitat — els agents actius poden executar-se indefinidament."
tips.t167: "L'aprovació d'ordres perilloses té 4 nivells: una vegada, sessió, sempre (llista d'autorització permanent), denega."
tips.t168: "El mode d'aprovació intel·ligent fa servir un LLM per aprovar automàticament ordres segures i marcar les perilloses."
tips.t169: "La protecció contra SSRF bloqueja xarxes privades, loopback, link-local i adreces de metadades del núvol."
tips.t170: "Els IDs de sessió tenen un prefix de timestamp (20250305_091523_abcd) perquè l'ordenació funcioni de manera natural a ls i jq."
tips.t171: "Els subprocessos MCP reben un entorn filtrat — només es transmeten les variables de sistema segures."
tips.t172: "Els fitxers de context (.hermes.md, AGENTS.md) se sotmeten a una anàlisi de seguretat per detectar injecció d'instruccions abans de carregar-los."
tips.t173: "command_allowlist a config.yaml aproveu permanentment patrons específics d'ordres de shell."
tips.t174: "El context es comprimeix automàticament quan arriba al llindar — les memòries es buiden i l'historial es resumeix."
tips.t175: "La barra d'estat es torna groga, després taronja i després vermella a mesura que el context s'omple."
tips.t176: "SOUL.md és el fitxer d'identitat principal de l'agent — personalitza'l per donar forma al comportament."
tips.t177: "Hermes carrega el context del projecte des de .hermes.md, AGENTS.md, CLAUDE.md o .cursorrules (la primera coincidència)."
tips.t178: "Els fitxers AGENTS.md de subdirectoris es detecten progressivament a mesura que l'agent navega per les carpetes."
tips.t179: "Els fitxers de context tenen un límit de 20.000 caràcters amb truncament intel·ligent del principi i del final."
tips.t180: "Cinc proveïdors de navegador: Chromium local, Browserbase, Browser Use, Camofox i Firecrawl."
tips.t181: "Camofox és un navegador contra la detecció — una bifurcació de Firefox amb suplantació d'empremta en C++."
tips.t182: "browser_navigate retorneu automàticament una instantània de la pàgina — no cal cridar browser_snapshot després."
tips.t183: "browser_vision amb annotate=true superposa etiquetes numerades sobre els elements interactius."
tips.t184: "hermes mcp obriu un selector interactiu de MCP aprovats per Nous que podeu instal·lar amb una sola pulsació de tecla."
tips.t185: "hermes mcp catalog llista els servidors MCP aprovats per Nous que s'inclouen amb el repositori."
tips.t186: "hermes mcp install <name> instal·la una entrada del catàleg, demana credencials i et deixeu triar quines eines activar."
tips.t187: "Els servidors MCP es configuren a config.yaml — s'admeten transports stdio i HTTP."
tips.t188: "Filtratge d'eines per servidor: tools.include fa llista blanca i tools.exclude fa llista negra d'eines específiques."
tips.t189: "Els servidors MCP generen conjunts d'eines automàticament en temps d'execució — les eines d'hermes poden activar-les o desactivar-les per plataforma."
tips.t190: "Suport d'OAuth per a MCP: auth: oauth activeu l'autorització basada en navegador amb PKCE."
tips.t191: "Els punts de control tenen sobrecàrrega zero quan no es modifiquen fitxers — activats per defecte."
tips.t192: "Es desa automàticament una instantània prèvia al desfer per poder desfer el desfer."
tips.t193: "/rollback també desfà el torn de conversa, de manera que l'agent no recordeu els canvis revertits."
tips.t194: "Els punts de control fan servir repositoris ombra a ~/.hermes/checkpoints/ — el .git del vostre projecte no es toca mai."
tips.t195: "batch_runner.py processa centenars d'instruccions en paral·lel per a la generació de dades d'entrenament."
tips.t196: "hermes chat -Q activeu el mode silenciós per a ús programàtic — suprimiu el bàner i el spinner."
tips.t197: "El desament de trajectòries (--save-trajectories) captura registres complets d'ús d'eines per a l'entrenament del model."
tips.t198: "Tres tipus de complement: general (eines/hooks), proveïdors de memòria i motors de context."
tips.t199: "hermes plugins install owner/repo instal·la complements directament des de GitHub."
tips.t200: "Proveïdors de memòria externs: Honcho, Hindsight, Mem0, OpenViking i més mitjançant hermes plugins install."
tips.t201: "Els hooks del complement inclouen pre/post_tool_call, pre/post_llm_call i transform_terminal_output per a la normalització de la sortida."
tips.t202: "La memòria cau d'instruccions (Anthropic) redueix els costos reutilitzant prefixos de la instrucció del sistema emmagatzemats a la memòria cau."
tips.t203: "L'agent genera automàticament títols de sessió en un fil en segon pla — impacte de latència zero."
tips.t204: "L'encaminament intel·ligent de models pot derivar automàticament consultes senzilles a un model més barat."
tips.t205: "Les ordres amb barra admeten coincidència de prefix: /h resol a /help, /mod a /model."
tips.t206: "Arrossegar un camí de fitxer al terminal adjunta automàticament imatges o les envieu com a context."
tips.t207: ".worktreeinclude a l'arrel del repositori llista els fitxers ignorats per git que s'han de copiar als worktrees."
tips.t208: "hermes acp executeu Hermes com a servidor ACP per a la integració amb VS Code, Zed i JetBrains."
tips.t209: "Proveïdors personalitzats: desa punts d'accés amb nom a config.yaml sota custom_providers."
tips.t210: "HERMES_EPHEMERAL_SYSTEM_PROMPT injecta una instrucció del sistema que mai no es conserva a l'historial."
tips.t211: "credential_pool_strategies admet fill_first, round_robin, least_used i random rotation."
tips.t212: "hermes auth add nous o hermes auth add openai-codex configuren proveïdors basats en OAuth."
tips.t213: "El servidor d'API admet tant Chat Completions com Responses API amb estat al servidor."
tips.t214: "tool_preview_length: 0 a la configuració mostra els camins complets dels fitxers al flux d'activitat del spinner."
tips.t215: "hermes status --deep executa comprovacions diagnòstiques més profundes en tots els components."
tips.t216: "Les tasques cron poden adjuntar un script de Python (--script) la sortida estàndard del qual s'injecta a la instrucció com a context."
tips.t217: "Els scripts cron viuen a ~/.hermes/scripts/ i s'executen abans de l'agent — perfectes per a canals de recollida de dades."
tips.t218: "prefill_messages_file a config.yaml injecta exemples few-shot a cada crida a l'API, i no es desa mai a l'historial."
tips.t219: "SOUL.md substitueix completament la identitat predeterminada de l'agent — reescriu-lo per fer-lo teu."
tips.t220: "SOUL.md es preomple automàticament amb una personalitat predeterminada en la primera execució. Edita'l per personalitzar-lo."
tips.t221: "/compress <focus topic> assigna el 60-70% del pressupost del resum al vostre tema i retalla agressivament la resta."
tips.t222: "En la segona compressió i posteriors, el compressor actualitza el resum anterior en lloc de començar de zero."
tips.t223: "Abans d'un reinici de sessió de passarel·la, Hermes buida automàticament els fets importants a la memòria en segon pla."
tips.t224: "network.force_ipv4: true a config.yaml soluciona bloquejos en servidors amb IPv6 trencat — aplica pedaços al socket."
tips.t225: "L'eina del terminal anota els codis de sortida habituals: grep que retorna 1 = 'No matches found (not an error)'."
tips.t226: "Les ordres de terminal en primer pla que fallen es tornen a provar automàticament fins a 3 vegades amb retrocés exponencial (2s, 4s, 8s)."
tips.t227: "Les ordres sudo sense més es reescriuen automàticament per passar SUDO_PASSWORD des de .env — no cal cap indicació interactiva."
tips.t228: "Els auxiliars d'execute_code requereixen imports explícits: from hermes_tools import json_parse, shell_quote, retry."
tips.t229: "Les 7 eines del sandbox d'execute_code (web_search, terminal, read/write/search/patch) fan servir RPC — no entren mai al context."
tips.t230: "Llegir la mateixa regió d'un fitxer 3 o més vegades activeu un avís. A 4 o més, es bloqueja durament per evitar bucles."
tips.t231: "write_file i patch detecten si un fitxer s'ha modificat externament des de la darrera lectura i avisen d'obsolescència."
tips.t232: "El format de pedaç V4A admet directives Add File, Delete File i Move File — no només Update."
tips.t233: "Els servidors MCP poden demanar completions del LLM de tornada mitjançant sampling — l'agent es converteix en una eina per al servidor."
tips.t234: "Els servidors MCP envien notificacions/tools/list_changed per activar el reregistre automàtic d'eines sense reiniciar."
tips.t235: "delegate_task amb acp_command: 'claude' engega Claude Code com a agent fill des de qualsevol plataforma."
tips.t236: "La delegació té un fil de batec — l'activitat del fill es propaga al pare, evitant temps d'espera de la passarel·la."
tips.t237: "Quan un proveïdor retorna HTTP 402 (pagament requerit), el client auxiliar fa automàticament fall back al següent."
tips.t238: "agent.tool_use_enforcement guia els models que descriuen accions en lloc de cridar eines — auto per a GPT/Codex."
tips.t239: "agent.restart_after_turn_timeout permet que els torns en curs acabin abans que /restart entri a stop(); restart_drain_timeout només és el pressupost d'interrupció forçada un cop comença stop()."
tips.t240: "agent.api_max_retries (per defecte 3) controla quantes vegades l'agent reintenta una crida fallida a l'API abans de mostrar l'error — redueix-lo per a un retorn ràpid al següent proveïdor."
tips.t241: "La passarel·la desa en memòria cau les instàncies d'AIAgent per sessió — destruir aquesta memòria cau trenca la memòria cau d'instruccions d'Anthropic."
tips.t242: "Qualsevol lloc web pot exposar habilitats mitjançant /.well-known/skills/index.json — el hub d'habilitats les descobreix automàticament."
tips.t243: "El registre d'auditoria d'habilitats a ~/.hermes/skills/.hub/audit.log fa seguiment de cada operació d'instal·lació i eliminació."
tips.t244: "Els worktrees de git obsolets es netegen automàticament en iniciar: els nets i completament fusionats es talen; el treball brut o no enviat sempre es conserva."
tips.t245: "Els perfils acoten l'estat d'Hermes mitjançant HERMES_HOME; els subprocessos de l'eina host mantenen el vostre HOME real tret que terminal.home_mode sigui profile."
tips.t246: "La variable d'entorn HERMES_HOME_MODE (octal, per exemple 0701) definiu permisos personalitzats de directori per al recorregut del servidor web."
tips.t247: "Mode contenidor: posa .container-mode a HERMES_HOME i la CLI de l'host s'executa automàticament dins del contenidor."
tips.t248: "Ctrl+C té 5 nivells de prioritat: cancel·lar enregistrament → cancel·lar instruccions → cancel·lar selector → interrompre l'agent → sortir."
tips.t249: "Cada interrupció durant una execució de l'agent es registra a ~/.hermes/interrupt_debug.log amb marques de temps."
tips.t250: "BROWSER_CDP_URL connecta les eines del navegador a qualsevol navegador Chromium en execució — admet WebSocket, HTTP o host:port."
tips.t251: "BROWSERBASE_ADVANCED_STEALTH=true activeu un mode avançat d'antidetecció amb Chromium personalitzat (Scale Plan)."
tips.t252: "La CLI canvieu automàticament al mode compacte en terminals de menys de 80 columnes."
tips.t253: "Les ordres ràpides admeten dos tipus: exec (executeu directament l'ordre de shell) i alias (redirecciona a una altra ordre)."
tips.t254: "Model de delegació per tasca: delegation.model i delegation.provider a la configuració envien els subagents a models més barats."
tips.t255: "delegation.reasoning_effort controla de manera independent la profunditat de raonament per als subagents."
tips.t256: "display.platforms a config.yaml permet substitucions de visualització per plataforma: {telegram: {tool_progress: all}}."
tips.t257: "human_delay.mode a la configuració simula la velocitat d'escriptura humana — rang configurable de min_ms/max_ms."
tips.t258: "Les migracions de versió de la configuració s'executen automàticament en carregar-la — les claus noves apareixen sense intervenció manual."
tips.t259: "Els models GPT i Codex reben una guia especial d'instrucció del sistema per a la disciplina d'eines i l'ús obligatori d'eines."
tips.t260: "Els models Gemini reben directrius adaptades per a camins absoluts, crides paral·leles a eines i ordres no interactives."
tips.t261: "context.engine a config.yaml es pot definir amb el nom d'un complement per a estratègies alternatives de gestió del context."
tips.t262: "Les instantànies de pàgina del navegador de més de 15.000 caràcters es retallen o es resumeixen automàticament; la instantània completa es desa a cache/web per a la paginació de read_file."
tips.t263: "El compressor fa una passada prèvia barata: les sortides d'eines de més de 200 caràcters se substitueixen per marcadors de posició abans que s'executi el LLM."
tips.t264: "Quan la compressió falla, els intents posteriors es posen en pausa durant 10 minuts per evitar saturar l'API."
tips.t265: "Les ordres llargues i perilloses (>70 caràcters) reben una opció 'view' a la sol·licitud d'aprovació per veure primer el text complet."
tips.t266: "La visualització de nivells d'àudio mostra barres ▁▂▃▄▅▆▇ durant l'enregistrament de veu segons els nivells RMS del micròfon."
tips.t267: "Els noms de perfil no poden coincidir amb binaris PATH existents — 'hermes profile create ls' es rebutjaria."
tips.t268: "hermes profile create backup --clone-all copia-ho tot (configuració, claus, SOUL.md, memòries, habilitats, sessions)."
tips.t269: "La tecla per enregistrar la veu es pot configurar mitjançant voice.record_key a config.yaml — no només Ctrl+B."
tips.t270: ".cursorrules i els fitxers .cursor/rules/*.mdc es detecten i es carreguen automàticament com a context del projecte."
tips.t271: "Els fitxers de context admeten més de 10 patrons d'injecció a la instrucció — Unicode invisible, 'ignore instructions', intents d'exfiltració."
tips.t272: "GPT-5 i Codex fan servir el rol 'developer' en lloc de 'system' en el format del missatge."
tips.t273: "Substitucions auxiliars per tasca: auxiliary.vision.provider, auxiliary.compression.model, etc. a config.yaml."
tips.t274: "El client auxiliar tracta 'main' com un àlies de proveïdor — resol el vostre proveïdor primari + model reals."
tips.t275: "hermes claw migrate --dry-run previsualitza la migració d'OpenClaw sense escriure res."
tips.t276: "Els camins de fitxer enganxats amb cometes o espais escapats es gestionen automàticament — no cal neteja manual."
tips.t277: "Les ordres amb barra mai no activen el col·lapse d'enganxada gran — /command amb arguments grans funciona correctament."
tips.t278: "En mode d'interrupció, les ordres amb barra escrites durant l'execució de l'agent esquiven la lògica d'interrupció i s'executen immediatament."
tips.t279: "HERMES_DEV=1 salta la detecció del mode contenidor per al desenvolupament local."
tips.t280: "Cada servidor MCP obté el seu propi conjunt d'eines (mcp-servername) que es pot activar o desactivar de manera independent mitjançant les eines de Hermes."
tips.t281: "Els marcadors de posició MCP ${ENV_VAR} de la configuració es resolen en engegar el servidor, incloses les variables de ~/.hermes/.env."
tips.t282: "Les habilitats de repositoris de confiança (NousResearch) obtenen un nivell de seguretat 'trusted'; les habilitats de la comunitat reben una exploració addicional."
tips.t283: "La quarantena d'habilitats a ~/.hermes/skills/.hub/quarantine/ conté les habilitats pendents de revisió de seguretat."
tips.t284: "/steer <prompt> insereix una nota després de la crida següent a una eina — orienta la direcció a mig fer sense interrompre."
tips.t285: "/goal <text> definiu un objectiu permanent de bucle Ralph — Hermes continua automàticament torn rere torn fins que un verificador digui fet."
tips.t286: "/snapshot create [label] desa una instantània completa de l'estat de la configuració de Hermes; /snapshot restore <id> la reverteix més endavant."
tips.t287: "/copy [N] copia la darrera resposta de l'assistent al porta-retalls, o la N-èssima des del final amb un número."
tips.t288: "/redraw força un repintat complet de la interfície, i corregeix la deriva del terminal després de redimensionar tmux o d'artefactes de selecció amb el ratolí."
tips.t289: "/agents (àlies /tasks) mostra els agents actius i les tasques en segon pla en execució dins la sessió actual."
tips.t290: "/footer activeu o desactiveu el peu de pàgina de la passarel·la en les respostes finals, amb el model, el % de context i el cwd."
tips.t291: "/busy queue|steer|interrupt controla què fa la tecla Retorn mentre Hermes està treballant."
tips.t292: "/topic als missatges directes de Telegram activeu el mode de tema multissessió gestionat per l'usuari — /topic <id> restaura sessions passades en línia."
tips.t293: "/approve session|always executa una ordre perillosa pendent amb l'àmbit de confiança que triïs; /deny la rebutja."
tips.t294: "/restart reinicia suaument la passarel·la després de buidar les execucions actives, i després fa ping al sol·licitant quan torna a estar en funcionament."
tips.t295: "/kanban boards switch <slug> canvieu el tauler Kanban multiprojecte actiu des de dins del xat."
tips.t296: "/reload torneu a carregar ~/.hermes/.env dins la sessió en execució — incorpora les noves claus d'API sense reiniciar."
tips.t297: "cronjob amb no_agent=True executa un script segons el programa i en envieu stdout directament — zero tokens, zero LLM."
tips.t298: "Una stdout buida d'un script cron significa un tic silenciós — no s'entrega res, perfecte per a vigilants de llindar."
tips.t299: "HERMES_CRON_MAX_PARALLEL (per defecte 4) limita quantes tasques cron s'executen per tic perquè les ràfegues no saturin les vostres claus."
tips.t300: "Els hooks de la passarel·la viuen a ~/.hermes/hooks/<name>/ amb HOOK.yaml + handler.py — el controlador s'ha d'anomenar `handle`."
tips.t301: "Els esdeveniments de hook inclouen gateway:startup, session:start, agent:step i subscripcions amb comodí command:*."
tips.t302: "Deixeu una llista de comprovació a ~/.hermes/BOOT.md i un hook gateway:startup l'executa com un agent d'una sola vegada a cada arrencada."
tips.t303: "hermes curator run --dry-run previsualitza què arxivaria o consolidaria el curador sense modificar res."
tips.t304: "hermes curator pin <skill> posa un límit estricte a una habilitat contra tant l'arxivament automàtic com l'eina skill_manage de l'agent."
tips.t305: "hermes curator rollback restaura habilitats d'una instantània prèvia a l'execució — les còpies de seguretat viuen a skills/.curator_backups/."
tips.t306: "hermes auth reset <provider> [target] esborra els temps de refredament i els senyals d'esgotament d'un conjunt de credencials sencer, o d'una sola credencial per índex, id o etiqueta."
tips.t307: "credential_pool_strategies.<provider>: round_robin gira les claus de manera uniforme en lloc del valor per defecte fill_first."
tips.t308: "use_gateway: true per eina encamina web, image, tts o browser a través de la vostra subscripció Nous — sense claus addicionals."
tips.t309: "provider_routing.data_collection: deny exclou els proveïdors d'emmagatzematge de dades a OpenRouter."
tips.t310: "provider_routing.require_parameters: true només encamina cap a proveïdors que admeten tots els paràmetres de la vostra sol·licitud."
tips.t311: "HERMES_TUI_RESUME=1 es torneu a connectar automàticament a la sessió TUI més recent en iniciar — útil després de caigudes d'SSH."
tips.t312: "HERMES_TUI_THEME=light|dark|<hex> força el tema de la TUI als terminals que no defineixen COLORFGBG."
tips.t313: "Ctrl+G o Ctrl+X Ctrl+E a la TUI obriu la memòria intermèdia d'entrada a $EDITOR per a instruccions llargues de diverses línies."
tips.t314: "La TUI renderitza LaTeX en línia — $E=mc^2$ es converteix en matemàtiques Unicode en lloc de TeX en brut."
tips.t315: "hermes dashboard llança una interfície web local a 127.0.0.1:9119 — no surt cap dada del localhost."
tips.t316: "hermes dashboard incrusta la TUI completa de Hermes al vostre navegador mitjançant xterm.js i un PTY de WebSocket."
tips.t317: "Deixeu un YAML a ~/.hermes/dashboard-themes/ amb dos colors de paleta per canviar l'aspecte de tot el dashboard."
tips.t318: "Els complements del dashboard són d'integració directa: manifest.json + paquet JS a ~/.hermes/dashboard-plugins/ — no cal cap compilació de npm."
tips.t319: "layoutVariant: cockpit en un tema del dashboard afegiu una barra lateral esquerra de 260 px que els complements poden omplir mitjançant la ranura de la barra lateral."
tips.t320: "display.tool_progress_command: true exposa /verbose a les plataformes de missatgeria; per defecte només és per a CLI."
tips.t321: "HERMES_BACKGROUND_NOTIFICATIONS=result només fa ping quan acaben les tasques en segon pla (vs concise/all/error/off)."
tips.t322: "HERMES_WRITE_SAFE_ROOT restringeix write_file/patch als prefixos de directori; diversos camins mitjançant os.pathsep (: o ;)."
tips.t323: "HERMES_IGNORE_RULES salta la injecció automàtica de AGENTS.md, SOUL.md, .cursorrules, memory i habilitats pre-carregades."
tips.t324: "HERMES_ACCEPT_HOOKS aproveu automàticament hooks de shell no vistos declarats a config.yaml sense cap prompt TTY."
tips.t325: "auxiliary.goal_judge.model encamina el jutge de /goal a un model ràpid i barat per mantenir el cost del bucle gairebé a zero."
tips.t326: "Els punts de control salten els directoris amb més de 50.000 fitxers per evitar operacions git lentes en monorepositoris massius."
tips.t327: "tts.provider: piper executa TTS local en 44 llengües sobre CPU — les veus es baixen automàticament a ~/.hermes/cache/piper-voices/."
tips.t328: "tts.providers.<name>.type: command connecta qualsevol motor TTS de CLI amb els marcadors de posició {input_path} i {output_path}."
tips.t329: "API_SERVER_ENABLED=true executa un endpoint compatible amb OpenAI al costat de la passarel·la per a Open WebUI i LibreChat."
tips.t330: "GATEWAY_PROXY_URL executa una configuració dividida: I/O de plataforma localment, treball de l'agent delegat a un servidor API remot."
tips.t331: "MATRIX_DEVICE_ID fixa un ID de dispositiu estable per a E2EE — sense això, les claus roten a cada inici i el desxifrat històric falla."
tips.t332: "TELEGRAM_WEBHOOK_SECRET és obligatori sempre que TELEGRAM_WEBHOOK_URL estigui definit — genera'l amb openssl rand -hex 32."
tips.t333: "batch_runner.py --resume fa coincidir les instruccions completades pel text perquè les reordenacions del conjunt de dades no tornin a executar la feina acabada."
tips.t334: "/new inicia una sessió nova al mateix lloc (àlies /reset) — ID de sessió nou, historial net, la CLI continua oberta."
tips.t335: "/clear buida la pantalla del terminal I inicia una sessió nova — una sola drecera per a un reinici visual."
tips.t336: "/history imprimeix la conversa actual en línia sense sortir de la CLI — útil per rellegir ràpidament."
tips.t337: "/save escriviu la conversa actual al disc sense acabar la sessió."
tips.t338: "/status mostra la informació de la sessió d'un cop d'ull: ID, títol, model, ús de tokens i temps transcorregut."
tips.t339: "/image <path> adjunta un fitxer d'imatge local per a la vostra instrucció següent, sense enganxar ni arrossegar i deixar anar."
tips.t340: "/platforms mostra l'estat de connexió de la passarel·la i de les plataformes de missatgeria directament des del xat."
tips.t341: "/commands pagina la llista completa d'ordres amb barra + habilitats instal·lades — útil a les plataformes sense autocompleció amb Tab."
tips.t342: "/toolsets enumera tots els conjunts d'eines disponibles perquè sàpigues què accepta -t/--toolsets."
tips.t343: "/voice tts activeu el mode només TTS — l'agent respon en veu alta però tu continues escrivint les vostres instruccions."
tips.t344: "/reload-skills torneu a escanejar ~/.hermes/skills/ perquè les habilitats afegides apareguin sense reiniciar la sessió."
tips.t345: "/indicator kaomoji|emoji|unicode|ascii selecciona l'estil de l'indicador d'activitat de la TUI que es mostra durant les execucions de l'agent."
tips.t346: "/debug puja un paquet d'assistència (informació del sistema + registres) i retorna enllaços compartibles — també funciona al xat."
tips.t347: "hermes -z \"<prompt>\" és el one-shot més pur: resposta final a stdout, res més — ideal per canalitzar-ho en scripts."
tips.t348: "hermes chat --pass-session-id injecta l'ID de la sessió a la instrucció del sistema perquè l'agent s'hi pugui autoreferenciar."
tips.t349: "hermes chat --image path/to/pic.png adjunta una imatge local a una sola consulteu -q sense un pas de pujada separat."
tips.t350: "hermes chat --ignore-user-config salta la configuració d'usuari activeu — informes d'errors reproduïbles i execucions de CI."
tips.t351: "hermes chat --source tool etiqueta els xats programàtics perquè no omplin la llista de sessions de hermes."
tips.t352: "hermes dump --show-keys inclou empremtes de claus API emmascarades per a una depuració d'assistència més profunda."
tips.t353: "hermes sessions rename <ID> \"new title\" canvieu el nom de qualsevol sessió anterior; hermes sessions delete <ID> en suprimiu una."
tips.t354: "hermes import restaura un zip complet de còpia de seguretat de Hermes; les exportacions JSON/JSONL de sessions s'importen des de la pàgina Sessions del tauler."
tips.t355: "hermes fallback gestiona de manera interactiva la cadena de fallback_model — sense haver d'editar config.yaml manualment."
tips.t356: "hermes pairing gira el token d'aparellament dels missatges directes — el primer missatge després de la rotació reclama l'accés al bot."
tips.t357: "hermes setup guia els usuaris novells a través del proveïdor, les claus i la integració de la plataforma en un sol flux interactiu."
tips.t358: "hermes status --deep executa la comprovació completa de salut a tots els components; hermes status, sense més, és la vista ràpida."
tips.t359: "HERMES_AGENT_TIMEOUT=0 desactiveu el tancament per inactivitat de la passarel·la per a un agent en execució — fes-lo servir en execucions llargues de recerca."
tips.t360: "HERMES_ENABLE_PROJECT_PLUGINS=1 carrega automàticament complements locals del repositori des de ./.hermes/plugins/ — per disseny, està limitat per confiança."
tips.t361: "HERMES_DISABLE_FILE_STATE_GUARD=1 desactiveu la protecció de 'el fitxer ha canviat des que el vas llegir' a patch i write_file."
tips.t362: "HERMES_ALLOW_PRIVATE_URLS=true permet que les eines web accedeixin a localhost i a xarxes privades — desactivat per defecte en mode passarel·la."
tips.t363: "HERMES_OPTIONAL_SKILLS=name1,name2 instal·la automàticament habilitats addicionals del catàleg opcional en la primera execució per perfil."
tips.t364: "HERMES_BUNDLED_SKILLS apunta a un arbre personalitzat d'habilitats empaquetades — usat per l'empaquetament de Homebrew i Nix."
tips.t365: "HERMES_DUMP_REQUEST_STDOUT=1 aboca cada càrrega útil de petició de l'API a stdout en lloc de fitxers de registre."
tips.t366: "HERMES_OAUTH_TRACE=1 registra els intercanvis i els intents d'actualització de tokens OAuth emmascarats per depurar l'autenticació del proveïdor."
tips.t367: "HERMES_STREAM_RETRIES (per defecte 3) controla els intents de reconnexió enmig del flux davant errors de xarxa transitoris."
tips.t368: "HERMES_GATEWAY_BUSY_ACK_ENABLED=false silencia els missatges de reconeixement ⚡/⏳/⏩ quan un usuari envieu un missatge a un agent ocupat."
tips.t369: "HERMES_AGENT_NOTIFY_INTERVAL (per defecte 180 s) estableix amb quina freqüència la passarel·la fa ping amb el progrés en torns llargs."
tips.t370: "HERMES_RESTART_DRAIN_TIMEOUT (per defecte 900 s) limita quant temps espera /restart als processos en curs abans de forçar-ho."
tips.t371: "HERMES_CHECKPOINT_TIMEOUT (per defecte 30 s) limita la creació de punts de control del sistema de fitxers — augmenteu-ho en monorepositoris enormes."
tips.t372: "image_gen.model a config.yaml selecciona el model FAL: flux-2/klein, gpt-image-2, nano-banana-pro i més."
tips.t373: "image_gen.provider encamina la generació d'imatges a través d'un complement (OpenAI Images, Codex, FAL) en lloc del valor per defecte."
tips.t374: "AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY dirigeixen l'anàlisi visual a qualsevol punt final compatible amb OpenAI."
tips.t375: "API_SERVER_MODEL_NAME personalitza el nom del model a /v1/models — essencial per a configuracions d'Open WebUI amb diversos perfils."
tips.t376: "Els complements del tauler se serveixen des de /dashboard-plugins/<name>/ — deixeu fitxers a ~/.hermes/dashboard-plugins/."
tips.t377: "Els xats de --source tool queden exclosos de la llista de sessions de hermes per defecte — definiu --source explícitament per veure'ls."
