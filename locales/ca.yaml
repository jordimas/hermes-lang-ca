slash.browser.description: Connecta les eines del navegador al navegador Chromium o derivat que tens obert mitjançant CDP, o canvia al mode Browser Use
slash.plugins.description: Llista els complements instal·lats i el seu estat
slash.commands.description: Explora totes les ordres i habilitats (amb paginació)
slash.help.description: Mostra les ordres disponibles (/help skills llista les ordres d’habilitats; /help <text> filtra)
slash.palette.description: Obre la paleta de cerca aproximada d’ordres (també amb Ctrl+P)
slash.restart.description: Reinicia la passarel·la quan acabin les execucions actives
slash.usage.description: Mostra l’ús de tokens i els límits de peticions; `reset` bescanvia un restabliment del límit de Codex acumulat
slash.subscription.description: Consulta el pla de Nous i canvia’l al navegador
slash.login.description: Inicia la sessió amb un compte de Nous (conserva els connectors)
slash.topup.description: Mostra el saldo de Nous i gestiona la facturació al portal
slash.platforms.description: Mostra l’estat de la passarel·la i les plataformes de missatgeria
slash.platform.description: Atura, reprèn o llista una plataforma de la passarel·la que falla
slash.copy.description: Copia l’última resposta de l’assistent al porta-retalls
slash.paste.description: Adjunta una imatge del porta-retalls
slash.image.description: Adjunta un fitxer d’imatge local per a la instrucció següent
slash.version.description: Mostra la versió de Hermes Agent
slash.debug.description: Puja un informe de depuració (informació del sistema i registres) i obtén enllaços per compartir-lo
slash.quit.description: Surt de la CLI (utilitza --delete per eliminar també l’historial de la sessió)
