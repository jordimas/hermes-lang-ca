gateway.startup.db_corrupt: "⚠️ S'ha detectat corrupció a la base de dades de la sessió. Pot ser que els missatges no es desin. Opcions de recuperació:\n1. Executeu `hermes {profile_arg}doctor --fix`\n2. Atura la passarel·la i, després, recupera amb:\n   hermes {profile_arg}sessions recover --source {db_path} --inspect-only\n   (si indica que es pot recuperar) hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — la recuperació fa una instantània del fitxer danyat primer; NO executis `sqlite3 ... \".recover\"` sobre el state.db en viu, un CLI sqlite3 vulnerable pot corrompre'l encara més\n3. Restaura des d'una còpia de seguretat a {backups_dir}/\nExecuteu `hermes {profile_arg}doctor` per obtenir diagnòstics sanejats."
gateway.startup.db_fts_corrupt: "⚠️ La base de dades de la sessió ha informat d'un error de corrupció limitat a l'índex de cerca (FTS5); les taules de missatges no estan danyades. Pot ser que els missatges no es desin fins que no es repari: executeu `hermes {profile_arg}doctor --fix` i després torneu a iniciar la passarel·la. No executis eines de recuperació ni restauris una còpia de seguretat tret que `hermes {profile_arg}doctor` confirmi el dany."
