settings.fieldDescriptions.browser.useRealProfile: "La navegació local utilitza els teus inicis de sessió reals. Hermes copia el perfil del teu navegador per defecte (galetes, inicis de sessió, preferències) a una instantània gestionada i el fa servir amb el Chromium empaquetat — el teu perfil en viu no s’obre mai directament, i la còpia es refresca des d’aquest en cada execució. També permet que l’agent obri una sessió local amb perfil real si se li demana, fins i tot quan hi ha configurat un backend de navegador al núvol. Només s’admeten navegadors Chromium (Chrome, Edge, Brave, Brave Origin, Chromium); un navegador per defecte no Chromium falla amb un missatge clar. Desactivat per defecte."
