settings.fieldDescriptions.voice.voiceChatMode: "chained: speech-to-text → Hermes → text-to-speech amb els proveïdors de sota. gpt-live: un model de veu OpenAI full dúplex (gpt-live-1) escolta i parla, i trasllada cada petició real a Hermes — qualsevol model que hagis seleccionat respon amb el conjunt complet d’eines. Necessita una clau de l’API d’OpenAI; la capa de veu cobra 0,05 $ per minut."
