settings.gateway.intro: "Per defecte, local. Fes servir una connexió remota quan aquesta aplicació hagi de dirigir un backend de Hermes en un altre lloc. Les connexions de passarel·la són a nivell de màquina; els perfils es descobreixen a partir de les passarel·les a les quals et connectes."
